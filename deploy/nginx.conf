# Include in a server {} block; terminate TLS at that server.
# TRANSLATION_TRUSTED_PROXY=true only when these ports are private.
client_max_body_size 64k;
gzip on;
gzip_types application/json text/css application/javascript image/svg+xml;

location ^~ /_internal/ { return 404; }
location ^~ /_storage/ {
    include /etc/nginx/snippets/bugg-source-proxy-headers.conf;
    proxy_pass http://127.0.0.1:18450;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 1800s;
}
# Public direct-download paths used by weighted mirror redirects; only
# /_internal/ is private. Keep bytes on the mirror process.
location ^~ /_mirror_node/ {
    include /etc/nginx/snippets/bugg-source-proxy-headers.conf;
    proxy_pass http://127.0.0.1:18450;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 1800s;
}
# Preserve the launcher's official query parameters when moving the source host.
location ^~ /api/curseforge/v1/ {
    include /etc/nginx/snippets/bugg-source-proxy-headers.conf;
    proxy_pass http://127.0.0.1:18448/v1/catalog/curseforge/;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_read_timeout 40s;
}
location ^~ /api/modrinth/v2/ {
    include /etc/nginx/snippets/bugg-source-proxy-headers.conf;
    proxy_pass http://127.0.0.1:18448/v1/catalog/modrinth/;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_read_timeout 40s;
}
# On both hub and approved mirrors, search uses the existing federation read path.
location = /api/v1/search {
    include /etc/nginx/snippets/bugg-source-proxy-headers.conf;
    proxy_pass http://127.0.0.1:18448/v1/search;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_read_timeout 25s;
}
location = /api/v1/search/capabilities {
    include /etc/nginx/snippets/bugg-source-proxy-headers.conf;
    proxy_pass http://127.0.0.1:18448/v1/search/capabilities;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
}
location ~ ^/api/v1/projects/((?:modrinth|curseforge):[A-Za-z0-9_-]+)/similar$ {
    include /etc/nginx/snippets/bugg-source-proxy-headers.conf;
    proxy_pass http://127.0.0.1:18448/v1/search/projects/$1/similar$is_args$args;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_read_timeout 25s;
}
location ^~ /api/v1/internal/cached-artifacts/ {
    client_max_body_size 256m;
    include /etc/nginx/snippets/bugg-source-proxy-headers.conf;
    proxy_pass http://127.0.0.1:18449;
    proxy_request_buffering off;
    proxy_read_timeout 200s;
}
location /api/v1/ {
    include /etc/nginx/snippets/bugg-source-proxy-headers.conf;
    proxy_pass http://127.0.0.1:18449;
    proxy_read_timeout 30s;
}
location = /dependency-health {
    include /etc/nginx/snippets/bugg-source-proxy-headers.conf;
    proxy_pass http://127.0.0.1:18449/health;
}
location = /v1/admin/mirror {
    client_max_body_size 2m;
    include /etc/nginx/snippets/bugg-source-proxy-headers.conf;
    proxy_pass http://127.0.0.1:18448;
    proxy_read_timeout 100s;
}
location = /v1/events {
    include /etc/nginx/snippets/bugg-source-proxy-headers.conf;
    proxy_pass http://127.0.0.1:18448;
    proxy_buffering off;
    proxy_read_timeout 150s;
}
location ^~ /room-cache/ {
    include /etc/nginx/snippets/bugg-source-proxy-headers.conf;
    proxy_pass http://127.0.0.1:18450;
    proxy_set_header Cookie "";
    client_max_body_size 2048m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 1800s;
}
location ~ "^/(?:assets/[a-f0-9]{2}/[a-f0-9]{40}$|java/|mods/|mc/game/|v1/(?:packages/|objects/|products/java-runtime/)|maven/|fabric-meta/|fabric-maven/|neoforge-maven/|quilt-meta/|quilt-maven/|mirrors/authlib-injector/)" {
    include /etc/nginx/snippets/bugg-source-proxy-headers.conf;
    proxy_pass http://127.0.0.1:18450;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 1800s;
}
location / {
    include /etc/nginx/snippets/bugg-source-proxy-headers.conf;
    proxy_pass http://127.0.0.1:18448;
    proxy_read_timeout 150s;
}
