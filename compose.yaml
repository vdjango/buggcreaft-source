services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    environment:
      POSTGRES_DB: bugg_source
      POSTGRES_USER: bugg
      POSTGRES_PASSWORD: ${BUGG_POSTGRES_PASSWORD:?Set BUGG_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugg -d bugg_source"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
