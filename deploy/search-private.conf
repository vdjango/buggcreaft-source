# Example PRIVATE ingress, separate from the public server. Adapt trusted CIDRs,
# private names and certificate files. Not enabled or TLS-tested automatically.
server {
    listen 18453 ssl;
    server_name search-source.internal;
    ssl_certificate /etc/bugg/private-fullchain.pem;
    ssl_certificate_key /etc/bugg/private-key.pem;
    allow 127.0.0.1;
    allow 10.20.0.0/16;
    deny all;
    client_max_body_size 64k;
    location ~ ^/_internal/search/(changes|validate|visibility)$ {
        proxy_pass http://127.0.0.1:18448;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_read_timeout 20s;
    }
    location / { return 404; }
}
server {
    listen 18454 ssl;
    server_name search-model.internal;
    ssl_certificate /etc/bugg/private-fullchain.pem;
    ssl_certificate_key /etc/bugg/private-key.pem;
    allow 127.0.0.1;
    allow 10.20.0.0/16;
    deny all;
    client_max_body_size 128k;
    location = /health { proxy_pass http://127.0.0.1:18452; }
    location = /v1/embeddings {
        proxy_pass http://127.0.0.1:18452;
        proxy_read_timeout 20s;
    }
    location / { return 404; }
}
