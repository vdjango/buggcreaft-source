# Primary host drop-in: zz-bugg-source.conf (after legacy drop-ins).
[Service]
WorkingDirectory=/opt/bugg-source/current
Environment=PYTHONPATH=/opt/bugg-source/current/src
Environment=TRANSLATION_CLOUD_CREDENTIALS_FILE=/etc/buggcraft-cloud-credentials.json
EnvironmentFile=/etc/bugg-source.env
ExecStart=
ExecStart=/opt/bugg-source/current/.venv/bin/bugg-source platform --workers 1
ReadWritePaths=/var/lib/bugg-source
MemoryMax=1400M
TasksMax=256
CPUQuota=150%
TimeoutStopSec=35
