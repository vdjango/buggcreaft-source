[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bugg-source"
version = "0.1.0"
description = "Evidence-backed Minecraft artifact metadata collection"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "sqlalchemy>=2.0.36,<3", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "aiohttp>=3.11,<4", "aiosqlite>=0.21,<1", "bleach>=6.2,<7",
  "jsonschema>=4.23,<5", "markdown-it-py>=3,<5",
  "jieba==0.42.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
s3 = ["boto3>=1.36,<2"]
qiniu = ["qiniu>=7.18,<8"]
acme = ["certbot>=4,<6", "certbot-dns-cloudflare>=4,<6"]
acme-tencent = ["certbot>=4,<6", "certbot-dns-tencentcloud==2.1.1"]
windows = ["pywin32>=306; platform_system == 'Windows'"]
embedding = ["fastembed==0.7.4"]

[project.scripts]
bugg-source = "bugg_source.cli:main"
mc-translate = "mc_translate.__main__:main"
mc-mirror = "mc_translate.mirror:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mc_translate = ["public-seo.json", "web/*", "web/examples/*", "contracts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/platform"]
markers = ["postgres: requires BUGG_TEST_POSTGRES_URL pointing to an empty test database"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["reference", "src/mc_translate", "tests/platform"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
