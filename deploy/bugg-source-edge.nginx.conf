# mirror.bugg.icu is the existing public entry. Catalog/account pages stay on
# the Shanghai hub; file bytes and storage authorization belong to Chengdu.
upstream bugg_source_hub {
    server 81.68.225.236:443;
    keepalive 8;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mirror.bugg.icu;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/bugg-source/acme; }
    location / { return 301 https://mirror.bugg.icu$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name mirror.bugg.icu;
    ssl_certificate /etc/nginx/ssl/mirror.bugg.icu/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mirror.bugg.icu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 2m;
    add_header X-Bugg-Origin chengdu always;
    proxy_set_header Host mirror.bugg.icu;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_ssl_server_name on;
    proxy_ssl_name node.bugg.icu;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/bugg-source/acme; }
    location = /mirror-api/status {
        proxy_pass http://127.0.0.1:18450;
        proxy_hide_header Cache-Control;
        add_header Cache-Control no-store always;
        add_header X-Bugg-Origin chengdu always;
    }
    location ^~ /_internal/ { return 404; }
    location ^~ /api/v1/internal/cached-artifacts/ { return 404; }
    location ^~ /room-cache/ {
        client_max_body_size 2048m;
        proxy_pass http://127.0.0.1:18450;
        proxy_set_header Cookie "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1800s;
    }
    location ^~ /_storage/ {
        proxy_pass http://127.0.0.1:18450;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1800s;
    }
    location ~ "^/(?:_mirror_node/|assets/[a-f0-9]{2}/[a-f0-9]{40}$|java/|mods/|mc/game/|v1/(?:packages/|objects/|products/java-runtime/)|maven/|fabric-meta/|fabric-maven/|neoforge-maven/|quilt-meta/|quilt-maven/|mirrors/authlib-injector/)" {
        proxy_pass http://127.0.0.1:18450;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1800s;
    }
    location / {
        proxy_pass https://bugg_source_hub;
        proxy_http_version 1.1;
        proxy_set_header Host mirror.bugg.icu;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 100s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control no-store always;
        add_header X-Bugg-Origin chengdu always;
    }
}
